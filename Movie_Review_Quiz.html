<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Review Quiz · 리뷰로 영화 맞히기</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --card:#20242d; --text:#f5f7fb; --muted:#aeb6c7;
  --line:#303643; --pos:#7ee787; --neg:#ff7b72; --accent:#c7ff4a; --accent2:#7aa2ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{padding:26px 24px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#11151b,#171b23)}
header h1{margin:0;font-size:clamp(24px,4.5vw,40px);letter-spacing:-1px}
header p{color:var(--muted);margin:8px 0 0;max-width:820px}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.card h2{margin-top:0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select{font:inherit}
button{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#111;font-weight:800;cursor:pointer}
button.secondary{background:#2a3040;color:var(--text);border:1px solid var(--line)}
button.blue{background:var(--accent2);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
select{width:100%;max-width:220px;background:#11151b;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.callout{border-left:4px solid var(--accent);padding:12px 14px;background:#141922;border-radius:8px;line-height:1.65}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-right:8px}
.badge.p{background:rgba(126,231,135,.15);color:var(--pos)} .badge.n{background:rgba(255,123,114,.15);color:var(--neg)}
.small{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:640px){.choices{grid-template-columns:1fr}}
.choices button{width:100%;text-align:left;background:#2a3040;color:var(--text);border:1px solid var(--line);font-weight:700}
.rev{max-height:340px;overflow:auto;margin:10px 0;line-height:1.7;font-size:15px}
.bigscore{font-size:40px;font-weight:800;letter-spacing:-1px}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:24px}
a{color:var(--accent2)}
.kpi{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px;font-size:13px}

.topnav{position:sticky;top:0;z-index:50;background:rgba(17,21,27,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:900px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 20px}
.brand{font-weight:800;letter-spacing:-.5px;font-size:17px;white-space:nowrap}
.nav-links{display:flex;gap:14px;font-size:13px}
.nav-links a{color:var(--muted);text-decoration:none}
.nav-links a:hover{color:var(--text)}
.nav-groups{display:flex;align-items:center;gap:6px;margin-left:auto}
.gbtn{border:1px solid var(--line);background:#20242d;color:var(--muted);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
.gbtn.active{background:var(--accent);color:#111;border-color:var(--accent)}
.gbtn:hover:not(.active){color:var(--text);border-color:var(--accent2)}
.upload{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.upload:hover{color:var(--text)}
.statusbar{max-width:900px;margin:auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
@media(max-width:640px){.nav-groups{margin-left:0;width:100%;flex-wrap:wrap}}
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav-inner">
    <span class="brand">🎮 Movie Review Quiz</span>
    <span class="nav-links">
      <a href="index.html">실습 허브</a>
      <a href="Movie_Review_Corpus_Lab.html">Corpus Lab</a>
    </span>
    <span class="nav-groups" id="navGroups"><span class="small">조 선택</span></span>
    <label class="upload" for="fileInput">CSV 업로드<input id="fileInput" type="file" accept=".csv,.txt" hidden></label>
  </div>
</nav>
<div class="statusbar">
  <span id="status">위 메뉴에서 조(A~F)를 선택하세요.</span>
  <span id="stats"></span>
  <span id="best" class="small"></span>
</div>

<div class="wrap">
  <section class="card" id="quizCard">
    <p class="small" style="margin-top:0">대중적인 영화의 리뷰를 <b>제목이 ■■■로 가려진</b> 상태로 읽고, 어떤 영화인지 4개 보기 중에서 고릅니다. Corpus Lab과 같은 조별 데이터를 씁니다.</p>
    <div class="controls">
      <button id="startBtn" disabled>퀴즈 시작 (10문항)</button>
    </div>
    <div id="quizBody" style="display:none;margin-top:14px">
      <div id="progress" class="small" style="margin-bottom:6px"></div>
      <div id="review" class="callout rev"></div>
      <div id="choices" class="choices"></div>
      <div id="feedback" style="margin-top:12px;font-size:15px"></div>
      <div class="controls" style="margin-top:12px">
        <button id="nextBtn" class="secondary" style="display:none">다음 문제 →</button>
        <button id="restartBtn" class="secondary" style="display:none">새 퀴즈</button>
      </div>
    </div>
    <div id="result" style="display:none;margin-top:16px" class="callout">
      <div class="bigscore"><span id="finalScore"></span> <span class="small">/ 10</span></div>
      <div id="resultMsg" style="margin-top:6px"></div>
      <div id="wrongList" class="small" style="margin-top:10px"></div>
    </div>
  </section>
</div>

<div class="foot">Movie Review Quiz · Group-sharded IMDb corpus · 제목은 학습을 위해 ■■■로 가려집니다</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const GROUPS = ["A","B","C","D","E","F"];
  const groupFile = g => `data/imdb_group_${g}.csv`;
  let rows = [], quiz = null, selectedGroup = "A";

  function buildNavGroups(){
    const box = $("navGroups");
    GROUPS.forEach(g=>{
      const b = document.createElement("button");
      b.className = "gbtn"; b.dataset.g = g; b.textContent = g;
      b.addEventListener("click", ()=>loadGroup(g));
      box.appendChild(b);
    });
  }
  function setActiveGroup(g){
    selectedGroup = g;
    document.querySelectorAll(".gbtn").forEach(b=>b.classList.toggle("active", b.dataset.g === g));
  }

  function urlGroup(){
    const g = (new URLSearchParams(location.search).get("group")||"").trim().toUpperCase();
    return GROUPS.includes(g) ? g : null;
  }

  function normSent(v){
    const s=String(v).trim().toLowerCase();
    if(["1","pos","positive","p","true"].includes(s)) return "positive";
    if(["0","neg","negative","n","false"].includes(s)) return "negative";
    const n=Number(s);
    if(Number.isFinite(n)){ if(n>=7) return "positive"; if(n<=4) return "negative"; }
    return null;
  }

  function parseCSV(text){
    text=String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    const recs=[]; let f="",rec=[],q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
      else{ if(c==='"') q=true;
        else if(c===','){ rec.push(f); f=""; }
        else if(c==='\n'){ rec.push(f); recs.push(rec); f=""; rec=[]; }
        else f+=c; }
    }
    if(f.length||rec.length){ rec.push(f); recs.push(rec); }
    if(!recs.length) return [];
    const h=recs[0].map(x=>x.trim().toLowerCase());
    const ri=h.findIndex(x=>["review","text","document","content","comment"].includes(x));
    const li=h.findIndex(x=>["label","sentiment","rating","score"].includes(x));
    const mi=h.findIndex(x=>["movie","title","film"].includes(x));
    const fi=h.findIndex(x=>["famous","popular","known"].includes(x));
    if(ri<0||li<0) throw new Error("review 열과 label 열을 찾지 못했습니다.");
    const out=[];
    for(let i=1;i<recs.length;i++){
      const v=recs[i];
      if(v.length===1 && v[0]==="") continue;
      const review=(v[ri]||"").trim();
      const sentiment=normSent(v[li]);
      const movie=mi>=0 ? String(v[mi]||"IMDb").trim() : "IMDb";
      const famous=fi>=0 && ["1","true","yes","y"].includes(String(v[fi]||"").trim().toLowerCase());
      if(review && sentiment) out.push({movie,review,sentiment,famous});
    }
    return out;
  }

  const esc = s => String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

  const TITLE_SKIP = new Set(["the","a","an","of","and","in","on","to","part","vol","for","with"]);
  function maskTitle(text, movie){
    const base = movie.replace(/\s*\(\d{4}\)\s*$/,"").trim();
    const variants = new Set([base, base.replace(/^The\s+/i,"")]);
    if(base.includes(":")) base.split(":").forEach(p=>{ p=p.trim(); if(p.length>3) variants.add(p); });
    base.split(/[^A-Za-z0-9']+/).forEach(w=>{
      if(w.length>=4 && !TITLE_SKIP.has(w.toLowerCase())) variants.add(w);
    });
    let out = text;
    [...variants].sort((a,b)=>b.length-a.length).forEach(v=>{
      if(v.length<3) return;
      out = out.replace(new RegExp("\\b"+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","ig"),"■■■");
    });
    return out;
  }

  function bestKey(g){ return "mrq-best-"+g; }
  function showBest(g){
    let b=null; try{ b=localStorage.getItem(bestKey(g)); }catch(e){}
    $("best").textContent = b ? `이 조 최고 점수: ${b} / 10` : "";
  }

  function afterLoad(g){
    const fam = [...new Set(rows.filter(r=>r.famous).map(r=>r.movie))];
    const total = rows.length;
    $("stats").innerHTML =
      `<span class="kpi">전체 리뷰 <b>${total.toLocaleString()}</b></span>` +
      `<span class="kpi">대중적 영화 <b>${fam.length}</b>편</span>` +
      `<span class="kpi">출제 가능 <b>${fam.length>=4 ? "예" : "아니오"}</b></span>`;
    $("startBtn").disabled = fam.length < 4;
    $("startBtn").textContent = fam.length < 4
      ? "대중적 영화가 4편 미만이라 출제 불가"
      : "퀴즈 시작 (10문항)";
    $("quizBody").style.display = "none";
    $("result").style.display = "none";
    showBest(g);
  }

  async function loadGroup(g){
    setActiveGroup(g);
    $("status").innerHTML = `<b>${g}조</b> 데이터를 불러오는 중...`;
    $("stats").innerHTML = "";
    try{
      const res = await fetch(groupFile(g), {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      rows = parseCSV(await res.text());
      if(rows.length < 50) throw new Error("리뷰 수가 너무 적습니다");
      history.replaceState(null,"", "?group="+g);
      $("status").innerHTML = `<b class="pos">${g}조 로드 완료</b> · ${rows.length.toLocaleString()}개 리뷰`;
      afterLoad(g);
    }catch(err){
      rows = [];
      $("status").innerHTML = `<b class="neg">${g}조 불러오기 실패</b> · ${esc(err.message)}<br>` +
        `<span class="small">${groupFile(g)} 파일이 GitHub에 있는지 확인하거나 CSV를 직접 업로드하세요.</span>`;
      $("startBtn").disabled = true;
    }
  }

  function currentGroup(){ return selectedGroup; }

  function startQuiz(){
    const by = {};
    rows.forEach(r=>{ if(r.famous){ (by[r.movie]=by[r.movie]||[]).push(r); } });
    const movies = Object.keys(by);
    if(movies.length < 4){ alert("대중적 영화가 4편 이상 필요합니다."); return; }
    const order = shuffle([...movies]);
    const qs = [];
    for(let i=0;i<10;i++){
      const correct = order[i % order.length];
      const r = by[correct][Math.random()*by[correct].length | 0];
      const distract = shuffle(movies.filter(m=>m!==correct)).slice(0,3);
      qs.push({review:r.review, sentiment:r.sentiment, correct, choices:shuffle([correct,...distract]), picked:null});
    }
    quiz = {qs, i:0, score:0, answered:false};
    $("quizBody").style.display = "block";
    $("result").style.display = "none";
    $("restartBtn").style.display = "none";
    render();
    $("quizCard").scrollIntoView({behavior:"smooth",block:"start"});
  }

  const strip = s => s.replace(/\s*\(\d{4}\)\s*$/,"");

  function render(){
    const q = quiz.qs[quiz.i];
    quiz.answered = false;
    $("progress").textContent = `${quiz.i+1} / 10 문항 · 현재 점수 ${quiz.score}`;
    $("review").innerHTML = `<span class="badge ${q.sentiment==="positive"?"p":"n"}">${q.sentiment}</span>` + esc(maskTitle(q.review, q.correct));
    const box = $("choices"); box.innerHTML = "";
    q.choices.forEach(c=>{
      const b = document.createElement("button");
      b.textContent = strip(c);
      b.addEventListener("click", ()=>answer(c,b));
      box.appendChild(b);
    });
    $("feedback").textContent = "";
    $("nextBtn").style.display = "none";
  }

  function answer(choice, btn){
    if(quiz.answered) return;
    quiz.answered = true;
    const q = quiz.qs[quiz.i];
    q.picked = choice;
    [...$("choices").children].forEach(b=>{
      b.disabled = true;
      if(b.textContent === strip(q.correct)){ b.style.background = "var(--pos)"; b.style.color = "#111"; }
      else if(b === btn){ b.style.background = "var(--neg)"; b.style.color = "#111"; }
    });
    if(choice === q.correct){ quiz.score++; $("feedback").innerHTML = `<b class="pos">정답!</b> — ${esc(q.correct)}`; }
    else $("feedback").innerHTML = `<b class="neg">오답</b> — 정답은 <b>${esc(q.correct)}</b>`;
    $("progress").textContent = `${quiz.i+1} / 10 문항 · 현재 점수 ${quiz.score}`;
    if(quiz.i < 9) $("nextBtn").style.display = "inline-block";
    else finish();
  }

  function finish(){
    const g = currentGroup();
    $("finalScore").textContent = quiz.score;
    const msgs = ["다시 도전해 볼까요?","리뷰를 더 꼼꼼히 읽어봐요.","좋아요, 절반 이상!","훌륭합니다!","영화 리뷰 마스터! 🏆"];
    $("resultMsg").textContent = msgs[Math.min(4, Math.floor(quiz.score/2))];
    const wrong = quiz.qs.filter(q=>q.picked !== q.correct);
    $("wrongList").innerHTML = wrong.length
      ? "<b>틀린 문항</b><br>" + wrong.map(q=>`· 정답 <b>${esc(q.correct)}</b> (내 답: ${esc(strip(q.picked||"-"))})`).join("<br>")
      : "전부 정답입니다!";
    $("result").style.display = "block";
    $("restartBtn").style.display = "inline-block";
    try{
      const prev = Number(localStorage.getItem(bestKey(g))) || 0;
      if(quiz.score > prev) localStorage.setItem(bestKey(g), String(quiz.score));
    }catch(e){}
    showBest(g);
  }

  $("startBtn").addEventListener("click", startQuiz);
  $("nextBtn").addEventListener("click", ()=>{ quiz.i++; render(); });
  $("restartBtn").addEventListener("click", startQuiz);
  $("fileInput").addEventListener("change", async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      rows = parseCSV(await f.text());
      if(!rows.length) throw new Error("읽을 수 있는 리뷰가 없습니다");
      $("status").innerHTML = `<b class="pos">업로드 성공</b> · ${rows.length.toLocaleString()}개 리뷰`;
      afterLoad(currentGroup());
    }catch(err){ alert(err.message); }
  });

  buildNavGroups();
  const g0 = urlGroup() || "A";
  setActiveGroup(g0);
  if(urlGroup()) loadGroup(g0);
  else { showBest(g0); $("status").textContent = "위 메뉴에서 조(A~F)를 선택하세요."; }
})();
</script>
</body>
</html>
