  .mission > summary{cursor:pointer;padding:.5rem .65rem;font-weight:700;font-size:.83rem;list-style:none;display:flex;gap:.4rem;align-items:baseline}
  .mission > summary::-webkit-details-marker{display:none}
  .mission > summary .mtag{font:700 .62rem/1 "IBM Plex Mono",monospace;color:#fff;background:var(--steamer);border-radius:99px;padding:.2em .5em;flex:0 0 auto}

  .mission details.ans > summary::-webkit-details-marker{display:none}

 11:{en:"Calcutta was reached at seven in the morning… According to his journal, he was due at Calcutta on the 25th of October, and that was the exact date of his actual arrival… The two days gained between London and Bombay had been lost, as has been seen, in the journey across India.",

 32:{en:"Phileas Fogg had, without suspecting it, gained one day on his journey… while Phileas Fogg, going eastward, saw the sun pass the meridian eighty times, his friends in London only saw it pass the meridian seventy-nine times. … “Here I am, gentlemen!” … nothing but a charming woman, who… made him the happiest of men!",

// ---------------- build map ----------------
var byOrder = {}; WP.forEach(function(w){ byOrder[w[0]] = w; });
var map = L.map('map', {worldCopyJump:true}).setView([30,40], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:9, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

var charLines = {}, charOn = {fogg:true, passe:false, fix:false, aouda:false};

function coords(pts){ return pts.map(function(o){ return [byOrder[o][8], byOrder[o][9]]; }); }
function drawChar(key){
  if (charLines[key]){ map.removeLayer(charLines[key]); delete charLines[key]; }
  if (!charOn[key]) return;
  var c = PATHS[key];
  charLines[key] = L.polyline(coords(c.pts), {color:c.color, weight: key==='fogg'?3:2.5,
    opacity: key==='fogg'?0.55:0.8, dashArray: key==='fogg'?null:'6 5'}).addTo(map);
}

// markers (Fogg's 32 points)
var markers = {};
WP.forEach(function(w){
  var m = L.marker([w[8], w[9]], {
    icon: L.divIcon({className:'', html:'<div class="marker-num">'+w[0]+'</div>', iconSize:[24,24], iconAnchor:[12,12]})
  }).addTo(map);
  m.on('click', function(){ selectWP(w[0]); });
  markers[w[0]] = m;
});

// ---------------- side panel ----------------
var toggleWrap = document.getElementById('charToggles');
Object.keys(PATHS).forEach(function(key){
  var c = PATHS[key];
  var lab = document.createElement('label');
  lab.style.color = c.color;
  lab.innerHTML = '<input type="checkbox" '+(charOn[key]?'checked':'')+'> <span class="sw" style="background:'+c.color+'"></span>'+c.name;
  lab.querySelector('input').addEventListener('change', function(e){
    charOn[key] = e.target.checked; drawChar(key);
  });
  toggleWrap.appendChild(lab);
});
document.getElementById('charLegend').innerHTML = CHAR_NOTE;
document.getElementById('modeLegend').innerHTML = Object.keys(MODE).map(function(k){
  return '<span><i style="background:'+MODE[k].color+'"></i>'+MODE[k].ko+'</span>';
}).join('');

var detail = document.getElementById('detail');
function selectWP(order){
  var w = byOrder[order];
  var modeK = MODE[w[6]] ? MODE[w[6]].ko : w[6];
  var sd = w[11], schedTxt = sd>0? ('+'+sd+'일 선행') : sd<0? (sd+'일 지연') : '±0';
  var p = PASS[order];
  detail.innerHTML =
    '<p class="wp-title">'+order+'. '+w[2]+' <span style="font-weight:400;color:var(--dim);font-size:.8rem">'+w[1]+'</span></p>'+
    '<p class="wp-meta">'+w[3]+' · Day '+w[10]+
      (w[4]?' · 도착 <b>'+w[4]+'</b>':'')+(w[5]?' · 출발 <b>'+w[5]+'</b>':'')+
      '<br>다음 구간: <b>'+modeK+'</b> ('+w[7]+') · 일정 <b>'+schedTxt+'</b> · 긴장도 <b>'+w[12]+'/10</b></p>'+
    '<p class="wp-event">'+w[13]+'</p>'+
    (p ? '<div class="passage"><div class="en">'+p.en+'</div><div class="ko">'+p.ko+'</div><div class="cite">Verne, «Around the World in Eighty Days», '+p.cite+' (Towle 역, public domain)</div></div>'
       : '<p class="hint">이 지점에는 발췌를 붙이지 않았습니다. 원문에서 직접 찾아 채워 보세요.</p>');
  map.panTo([w[8], w[9]]);
  markers[order].openPopup && markers[order].bindPopup('<b>'+order+'. '+w[2]+'</b><br>Day '+w[10]+' · '+w[13]).openPopup();
  highlightTension(order);
}

// ---------------- tension curve ----------------
var svg = document.getElementById('tension');
var TW=1000, TH=150, padL=8, padR=8, padT=14, padB=20;
function tx(day){ return padL + day/80*(TW-padL-padR); }
function ty(t){ return TH-padB - t/10*(TH-padT-padB); }
function buildTension(){
  var pts = WP.map(function(w){ return [tx(w[10]), ty(w[12]), w[0], w[12]]; });
  var d = pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var grid = '';
  [0,5,10].forEach(function(v){ grid += '<line x1="'+padL+'" y1="'+ty(v)+'" x2="'+(TW-padR)+'" y2="'+ty(v)+'" stroke="var(--line)"/>'; });
  [0,20,40,60,80].forEach(function(day){ grid += '<line x1="'+tx(day)+'" y1="'+padT+'" x2="'+tx(day)+'" y2="'+(TH-padB)+'" stroke="var(--line)" opacity=".5"/><text x="'+tx(day)+'" y="'+(TH-6)+'" font-size="9" fill="var(--dim)" text-anchor="middle">D'+day+'</text>'; });
  var dots = pts.map(function(p){ return '<circle data-o="'+p[2]+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4" fill="var(--rail)"><title>'+p[2]+'. 긴장도 '+p[3]+'/10</title></circle>'; }).join('');
  svg.innerHTML = grid +
    '<path d="'+d+'" fill="none" stroke="var(--rail)" stroke-width="2"/>' + dots +
    '<line id="tCursor" x1="'+tx(0)+'" y1="'+padT+'" x2="'+tx(0)+'" y2="'+(TH-padB)+'" stroke="var(--ink)" stroke-width="1.5"/>'+
    '<circle id="tHi" r="6" fill="none" stroke="var(--ink)" stroke-width="2" cx="-20" cy="-20"/>';
  svg.querySelectorAll('circle[data-o]').forEach(function(c){
    c.style.cursor='pointer';
    c.addEventListener('click', function(){ selectWP(Number(c.dataset.o)); });
  });
}
function highlightTension(order){
  var w = byOrder[order], hi = document.getElementById('tHi');
  if(hi){ hi.setAttribute('cx', tx(w[10])); hi.setAttribute('cy', ty(w[12])); }
}

// ---------------- timeline ----------------
var tl = document.getElementById('timeline'), dayLabel = document.getElementById('dayLabel'),
    statusLabel = document.getElementById('statusLabel'), cursor;
var DATE0 = new Date(1872,9,2);
function fmtDate(day){ var d = new Date(DATE0.getTime()+day*864e5); return (d.getMonth()+1)+'/'+d.getDate(); }
function currentWP(day){
  var cur = WP[0];
  for (var i=0;i<WP.length;i++){ if (WP[i][10] <= day) cur = WP[i]; }
  return cur;
}
function onTimeline(){
  var day = Number(tl.value);
  dayLabel.textContent = 'Day '+day+' · '+fmtDate(day);
  var w = currentWP(day), sd = w[11];
  statusLabel.textContent = '일정 ' + (sd>0?('+'+sd+'일'):sd<0?(sd+'일'):'±0');
  statusLabel.className = 'tl-status ' + (sd>0?'ahead':sd<0?'behind':'on');
  cursor = document.getElementById('tCursor');
  if (cursor){ cursor.setAttribute('x1', tx(day)); cursor.setAttribute('x2', tx(day)); }
  // reached markers emphasised
  WP.forEach(function(x){
    var el = markers[x[0]]._icon; if(!el) return;
    el.style.opacity = x[10] <= day ? '1' : '.32';
  });
  // draw a "reached so far" line along Fogg's route
  if (charLines._prog){ map.removeLayer(charLines._prog); }
  var reached = WP.filter(function(x){ return x[10] <= day; }).map(function(x){ return [x[8],x[9]]; });
  if (reached.length>1) charLines._prog = L.polyline(reached, {color:'#23201b', weight:4, opacity:.9}).addTo(map);
  highlightTension(w[0]);
}
tl.addEventListener('input', onTimeline);

var playing=null;
document.getElementById('playBtn').addEventListener('click', function(){
  if (playing){ clearInterval(playing); playing=null; this.textContent='▶ 재생'; return; }
  this.textContent='⏸ 정지';
  var self=this;
  playing = setInterval(function(){
    var v = Number(tl.value);
    if (v>=80){ clearInterval(playing); playing=null; self.textContent='▶ 재생'; return; }
    tl.value = v+1; onTimeline();
  }, 260);
});
